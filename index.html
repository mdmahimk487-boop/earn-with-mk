<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Earn with MK</title>

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Monetag Rewarded Interstitial -->
  <script src="https://libtl.com/sdk.js"
          data-zone="11920162"
          data-sdk="show_11920162"></script>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .container {
      max-width: 480px;
      margin: auto;
      padding: 20px;
    }

    .header {
      text-align: center;
      padding: 25px 10px;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .header p {
      color: #666;
    }

    .balance {
      background: white;
      border-radius: 18px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .balance-title {
      color: #777;
      font-size: 15px;
    }

    .balance-amount {
      font-size: 35px;
      font-weight: bold;
      margin-top: 8px;
    }

    .buttons {
      display: grid;
      gap: 12px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .watch {
      background: #222;
      color: white;
    }

    .withdraw {
      background: white;
      color: #222;
      border: 1px solid #ddd;
    }

    .info {
      text-align: center;
      color: #777;
      font-size: 13px;
      margin-top: 25px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>Earn with MK</h1>
      <p>Watch ads and earn rewards</p>
    </div>

    <div class="balance">
      <div class="balance-title">Your Balance</div>

      <div class="balance-amount" id="balance">
        ৳0.00
      </div>
    </div>

    <div class="buttons">

      <button
        class="watch"
        id="watchButton"
        onclick="watchAd()">
        🎁 Watch Ad & Earn
      </button>

      <button
        class="withdraw"
        onclick="withdraw()">
        💰 Withdraw
      </button>

    </div>

    <div class="info">
      Earn with MK • Telegram Mini App
    </div>

  </div>


  <script>

    // ==============================
    // CONFIG
    // ==============================

    const SUPABASE_URL =
      "https://fbfusyubrqhfipqbjwus.supabase.co";

    // IMPORTANT:
    // এখানে নিজের Supabase Publishable Key বসাও
    const SUPABASE_KEY =
      "sb_publishable_sXRqHsyqoIoAspEKGLiUHQ_9UgtKDNT";


    const FUNCTION_URL =
      SUPABASE_URL + "/functions/v1/telegram-api";


    // ==============================
    // SUPABASE
    // ==============================

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // ==============================
    // TELEGRAM
    // ==============================

    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();


    // ==============================
    // UI
    // ==============================

    let balance = 0;


    function updateBalance() {

      document.getElementById("balance").innerText =
        "৳" + Number(balance).toFixed(2);

    }


    // ==============================
    // INITIALIZE USER
    // ==============================

    async function initializeUser() {

      try {

        const initData = tg.initData;

        if (!initData) {

          alert(
            "Please open Earn with MK from Telegram."
          );

          return false;
        }


        const response = await fetch(
          FUNCTION_URL,
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
              "apikey": SUPABASE_KEY
            },

            body: JSON.stringify({
              action: "init",
              initData: initData
            })
          }
        );


        const result = await response.json();


        if (!response.ok || !result.success) {

          console.error(result);

          alert(
            "Could not connect to the server."
          );

          return false;
        }


        balance =
          Number(result.user.balance || 0);

        updateBalance();

        return true;


      } catch (error) {

        console.error(error);

        alert(
          "Connection error. Please try again."
        );

        return false;
      }
    }


    // ==============================
    // WATCH AD
    // ==============================

    async function watchAd() {

      const button =
        document.getElementById("watchButton");


      button.disabled = true;

      button.innerText =
        "⏳ Loading Ad...";


      try {

        if (
          typeof show_11920162 !== "function"
        ) {

          throw new Error(
            "Monetag SDK is not ready."
          );

        }


        // Show Monetag rewarded ad
        await show_11920162();


        button.innerText =
          "⏳ Adding Reward...";


        // Send reward to server
        const response = await fetch(
          FUNCTION_URL,
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
              "apikey": SUPABASE_KEY
            },

            body: JSON.stringify({
              action: "reward",
              initData: tg.initData
            })
          }
        );


        const result =
          await response.json();


        if (!response.ok || !result.success) {

          console.error(result);

          throw new Error(
            result.error || "Reward failed"
          );

        }


        // Database balance
        balance =
          Number(result.balance);


        updateBalance();


        alert(
          "Ad completed! ৳0.10 reward added."
        );


      } catch (error) {

        console.error(error);

        alert(
          "Reward could not be added. Please try again."
        );

      } finally {

        button.disabled = false;

        button.innerText =
          "🎁 Watch Ad & Earn";

      }
    }


    // ==============================
    // WITHDRAW
    // ==============================

    function withdraw() {

      alert(
        "Withdrawal system will be connected next."
      );

    }


    // ==============================
    // START APP
    // ==============================

    initializeUser();

  </script>

</body>
</html>
