<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Earn with MK</title>

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Monetag Rewarded Interstitial -->
  <script src="https://libtl.com/sdk.js"
          data-zone="11920162"
          data-sdk="show_11920162"></script>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .container {
      max-width: 480px;
      margin: auto;
      padding: 20px;
    }

    .header {
      text-align: center;
      padding: 25px 10px;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .header p {
      color: #666;
    }

    .balance {
      background: white;
      border-radius: 18px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .balance-title {
      color: #777;
      font-size: 15px;
    }

    .balance-amount {
      font-size: 35px;
      font-weight: bold;
      margin-top: 8px;
    }

    .buttons {
      display: grid;
      gap: 12px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .watch {
      background: #222;
      color: white;
    }

    .withdraw {
      background: white;
      color: #222;
      border: 1px solid #ddd;
    }

    .withdraw-form {
      display: none;
      background: white;
      border-radius: 18px;
      padding: 18px;
      margin-top: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .withdraw-form h3 {
      margin-top: 0;
      margin-bottom: 15px;
      text-align: center;
    }

    .withdraw-form input,
    .withdraw-form select {
      width: 100%;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
      margin-bottom: 10px;
      font-size: 16px;
      background: white;
    }

    .info {
      text-align: center;
      color: #777;
      font-size: 13px;
      margin-top: 25px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>Earn with MK</h1>
      <p>Watch ads and earn rewards</p>
    </div>

    <div class="balance">

      <div class="balance-title">
        Your Balance
      </div>

      <div class="balance-amount" id="balance">
        ৳0.00
      </div>

    </div>

    <div class="buttons">

      <button
        class="watch"
        id="watchButton"
        onclick="watchAd()">
        🎁 Watch Ad & Earn
      </button>

      <button
        class="withdraw"
        onclick="showWithdrawForm()">
        💰 Withdraw
      </button>

    </div>


    <!-- WITHDRAW FORM -->

    <div
      class="withdraw-form"
      id="withdrawForm">

      <h3>
        💰 Withdraw Money
      </h3>

      <input
        id="withdrawAmount"
        type="number"
        min="0.01"
        step="0.01"
        placeholder="Enter amount (৳)"
      >

      <select id="withdrawMethod">

        <option value="">
          Select payment method
        </option>

        <option value="bKash">
          bKash
        </option>

        <option value="Nagad">
          Nagad
        </option>

      </select>

      <input
        id="accountNumber"
        type="tel"
        placeholder="bKash/Nagad number"
      >

      <button
        class="watch"
        id="withdrawButton"
        onclick="submitWithdrawal()">

        📤 Submit Withdrawal

      </button>

    </div>


    <div class="info">
      Earn with MK • Telegram Mini App
    </div>

  </div>


  <script>

    // ==============================
    // CONFIG
    // ==============================

    const SUPABASE_URL =
      "https://fbfusyubrqhfipqbjwus.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_sXRqHsyqoIoAspEKGLiUHQ_9UgtKDNT";

    const FUNCTION_URL =
      SUPABASE_URL +
      "/functions/v1/telegram-api";


    // ==============================
    // SUPABASE
    // ==============================

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // ==============================
    // TELEGRAM
    // ==============================

    const tg =
      window.Telegram.WebApp;

    tg.ready();
    tg.expand();


    // ==============================
    // BALANCE
    // ==============================

    let balance = 0;


    function updateBalance() {

      document.getElementById(
        "balance"
      ).innerText =
        "৳" +
        Number(balance).toFixed(2);

    }


    // ==============================
    // INITIALIZE USER
    // ==============================

    async function initializeUser() {

      try {

        const initData =
          tg.initData;


        if (!initData) {

          alert(
            "Please open Earn with MK from Telegram."
          );

          return false;

        }


        const response =
          await fetch(
            FUNCTION_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json",

                "apikey":
                  SUPABASE_KEY
              },

              body: JSON.stringify({

                action:
                  "init",

                initData:
                  initData

              })

            }
          );


        const result =
          await response.json();


        if (
          !response.ok ||
          !result.success
        ) {

          console.error(result);

          alert(
            "Could not connect to the server."
          );

          return false;

        }


        balance =
          Number(
            result.user.balance || 0
          );


        updateBalance();

        return true;


      } catch (error) {

        console.error(error);

        alert(
          "Connection error. Please try again."
        );

        return false;

      }

    }


    // ==============================
    // WATCH AD
    // ==============================

    async function watchAd() {

      const button =
        document.getElementById(
          "watchButton"
        );


      button.disabled = true;

      button.innerText =
        "⏳ Loading Ad...";


      try {

        if (
          typeof show_11920162 !==
          "function"
        ) {

          throw new Error(
            "Monetag SDK is not ready."
          );

        }


        await show_11920162();


        button.innerText =
          "⏳ Adding Reward...";


        const response =
          await fetch(
            FUNCTION_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json",

                "apikey":
                  SUPABASE_KEY
              },

              body: JSON.stringify({

                action:
                  "reward",

                initData:
                  tg.initData

              })

            }
          );


        const result =
          await response.json();


        if (
          !response.ok ||
          !result.success
        ) {

          console.error(result);

          throw new Error(
            result.error ||
            "Reward failed"
          );

        }


        balance =
          Number(
            result.balance
          );


        updateBalance();


        alert(
          "Ad completed! ৳0.10 reward added."
        );


      } catch (error) {

        console.error(error);

        alert(
          "Reward could not be added. Please try again."
        );


      } finally {

        button.disabled = false;

        button.innerText =
          "🎁 Watch Ad & Earn";

      }

    }


    // ==============================
    // SHOW WITHDRAW FORM
    // ==============================

    function showWithdrawForm() {

      const form =
        document.getElementById(
          "withdrawForm"
        );


      if (
        form.style.display ===
        "block"
      ) {

        form.style.display =
          "none";

      } else {

        form.style.display =
          "block";

      }

    }


    // ==============================
    // SUBMIT WITHDRAWAL
    // ==============================

    async function submitWithdrawal() {

      const amount =
        Number(
          document.getElementById(
            "withdrawAmount"
          ).value
        );


      const method =
        document.getElementById(
          "withdrawMethod"
        ).value;


      const accountNumber =
        document.getElementById(
          "accountNumber"
        ).value.trim();


      if (
        !amount ||
        amount <= 0
      ) {

        alert(
          "Please enter a valid amount."
        );

        return;

      }


      if (
        amount > balance
      ) {

        alert(
          "Insufficient balance."
        );

        return;

      }


      if (!method) {

        alert(
          "Please select a payment method."
        );

        return;

      }


      if (!accountNumber) {

        alert(
          "Please enter your account number."
        );

        return;

      }


      const button =
        document.getElementById(
          "withdrawButton"
        );


      button.disabled = true;

      button.innerText =
        "⏳ Submitting...";


      try {

        const response =
          await fetch(
            FUNCTION_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json",

                "apikey":
                  SUPABASE_KEY
              },

              body: JSON.stringify({

                action:
                  "withdraw",

                initData:
                  tg.initData,

                amount:
                  amount,

                method:
                  method,

                accountNumber:
                  accountNumber

              })

            }
          );


        const result =
          await response.json();


        if (
          !response.ok ||
          !result.success
        ) {

          console.error(result);

          throw new Error(
            result.error ||
            "Withdrawal failed"
          );

        }


        balance =
          Number(
            result.balance
          );


        updateBalance();


        alert(
          "Withdrawal request submitted successfully."
        );


        document.getElementById(
          "withdrawAmount"
        ).value = "";


        document.getElementById(
          "withdrawMethod"
        ).value = "";


        document.getElementById(
          "accountNumber"
        ).value = "";


        document.getElementById(
          "withdrawForm"
        ).style.display =
          "none";


      } catch (error) {

        console.error(error);

        alert(
          error.message ||
          "Withdrawal request failed."
        );


      } finally {

        button.disabled = false;

        button.innerText =
          "📤 Submit Withdrawal";

      }

    }


    // ==============================
    // START APP
    // ==============================

    initializeUser();

  </script>

</body>
</html>
